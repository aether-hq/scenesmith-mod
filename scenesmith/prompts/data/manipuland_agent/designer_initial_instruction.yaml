name: "designer_initial_instruction"
version: "1.1"
description: "Initial instruction for manipuland designer to start placement"
template_variables: ["has_reference_image"]
prompt: |
  Populate this furniture surface using the bounded fast path.

  1. In the FIRST response, call get_current_scene_state and list_available_assets
     together. Do not call observe_scene or designer_todo_manager.
  2. Reuse suitable objects or call generate_assets once for 1-3 small essentials.
  3. Place them immediately on valid support surfaces using structured dimensions
     and clearance heights.
  4. Call check_physics once; move or remove violations, then return.

  At most one observe_scene call is allowed after placement, and it is optional.
  {% if has_reference_image %}

  **The reference image above shows your DESIGN GOAL** - what the furniture should
  look like AFTER you place objects. The furniture is currently EMPTY.

  Treat the reference as optional inspiration; structured scene state is authoritative.
  {% endif %}

  ## Return Format:
  List objects placed with surface-relative coordinates and the physics result.
