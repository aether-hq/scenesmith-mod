name: "designer_initial_instruction"
version: "1.0"
description: "Instructions for initial wall decoration design phase"
template_variables: ["wall_summary"]
prompt: |
  Create the initial wall decoration using this bounded fast path.

  1. In the FIRST response, call get_current_scene_state and list_available_assets
     together. Do not call observe_scene or designer_todo_manager.
  2. Reuse suitable assets. In the NEXT response, call generate_assets at most once
     for 1-3 missing focal decorations as one batch.
  3. Place them immediately using wall dimensions and excluded regions from the
     structured state. Prefer one strong focal wall over decorating every wall.
  4. Call check_physics once; move or remove concrete violations, then return.

  At most one observe_scene call is allowed after placement, and it is optional.
  Asset ranking, canonical frames, and clearance checks are deterministic downstream.

  ## Wall Surfaces Available:
  {{ wall_summary }}

  ## Return Format:
  List wall objects placed with wall IDs/coordinates and the physics result.
