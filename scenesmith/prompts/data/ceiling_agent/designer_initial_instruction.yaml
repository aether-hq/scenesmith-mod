name: "designer_initial_instruction"
version: "1.0"
description: "Instructions for initial ceiling decoration design phase"
template_variables: ["room_width", "room_depth", "ceiling_height"]
prompt: |
  Create the initial ceiling decoration using this bounded fast path.

  1. In the FIRST response, call get_current_scene_state and list_available_assets
     together. Do not call observe_scene or designer_todo_manager.
  2. Reuse a suitable fixture or call generate_assets once for 1-2 missing fixtures.
  3. Place the primary fixture immediately from the exact room dimensions below.
     Add a second only when needed for coverage.
  4. Call check_physics once; move or remove violations, then return.

  At most one observe_scene call is allowed after placement, and it is optional.

  ## Room Dimensions:
  - Width: {{ room_width }}m
  - Depth: {{ room_depth }}m
  - Ceiling Height: {{ ceiling_height }}m

  ## Ceiling Coordinate System:
  - X: Position along room width (meters from minimum X)
  - Y: Position along room depth (meters from minimum Y)
  - Rotation: Degrees around vertical axis (Z)

  ## Return Format:

  List ceiling objects placed with coordinates and the physics result.
