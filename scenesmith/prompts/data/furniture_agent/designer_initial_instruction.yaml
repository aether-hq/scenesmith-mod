name: "designer_initial_instruction"
version: "1.0"
description: "Instructions for initial furniture design phase"
template_variables: ["scene_description", "has_reference_image"]
prompt: |
  Create the initial furniture layout for this room using the bounded fast path below.

  ## BOUNDED FAST PATH (MANDATORY)
  The scene pipeline enforces a short wall-clock budget. Do not spend the initial
  design phase on visual critique or project-management narration.

  1. In your FIRST response, call get_current_scene_state and list_available_assets
     together. Do NOT call observe_scene or designer_todo_manager yet.
  2. Reuse suitable returned assets. In your NEXT response, call generate_assets
     once for all missing essentials as one batch. Request 3-5 distinct assets,
     not decorative variants or duplicates.
  3. Place the essentials immediately using the exact returned names. Parallelize
     independent placements in one response when possible.
  4. Call check_physics once. Fix concrete violations with moves/removals; do not
     start another design pass.
  5. Return the concise placement summary. Do not call the TODO manager. At most
     one observe_scene call is allowed, after placement only, and it is optional.

  Prefer a complete, usable layout with a few good catalog assets over a larger
  speculative layout. Asset selection, canonical frames, support zones, and
  clearances are handled deterministically downstream.

  The floor-plan stage has already authored all stairs, ramps, platforms,
  mezzanines, railings, balconies, and bridges. Never request or place those as
  furniture, even when they are mentioned in the scene prompt.

  {% if has_reference_image %}
  A reference image showing a possible design arrangement has been provided above
  for inspiration. This shows one way a room with similar dimensions could be furnished.
  Use the concepts and ideas from this reference to inform your design, but adapt them
  creatively to the actual room.

  Use the reference only as optional inspiration after the fast path has obtained
  the actual scene state.
  {% else %}
  Use the exact scene state returned by get_current_scene_state for placement.
  {% endif %}

  ## Return Format:
  List furniture placed with coordinates and the final deterministic physics result.

  ## Scene Requirements:
  {{ scene_description }}
