repos:
- repo: local
  hooks:
  - id: python-architecture-limits
    name: Python architecture limits (800 lines / 10 files)
    entry: uv run python scripts/architecture/check_python_layout.py
    language: system
    pass_filenames: false

- repo: https://github.com/psf/black
  rev: 25.1.0
  hooks:
  - id: black

- repo: https://github.com/pycqa/isort
  rev: 5.12.0
  hooks:
    - id: isort
      name: isort (python)

- repo: https://github.com/PyCQA/autoflake
  rev: v2.0.2
  hooks:
    - id: autoflake
      args: [--remove-all-unused-imports, --in-place]

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.7.8 # uv version
  hooks:
    - id: uv-lock
